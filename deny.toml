[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Transitive via teloxide -> aquamarine. RUSTSEC marks it unmaintained, not
# vulnerable, and provides no safe upgrade. Revisit when teloxide removes it.
ignore = ["RUSTSEC-2026-0173"]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
