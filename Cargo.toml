[package]
name = "im-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
authors = ["IM Bridge Contributors"]
description = "Telegram-to-SillyTavern sidecar with durable delivery and an admin API"
default-run = "im-bridge"
publish = false

[lib]
name = "im_bridge"
path = "src/lib.rs"

[[bin]]
name = "im-bridge"
path = "src/main.rs"

[features]
default = []
e2e-control = []

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rmp-serde = "1"
rust-embed = "8"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
subtle = "2"
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "rustls"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "util", "set-header", "timeout"] }
tower-sessions = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
insta = { version = "1", features = ["json"] }
tempfile = "3"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util", "limit"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
