name: Audit C03 recovery validation
on:
  push:
    branches: [audit-work/recovery-validation-20260917]
permissions:
  contents: read
concurrency:
  group: audit-c03-recovery-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
    steps:
      - name: Check out isolated verification inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: S04-S06 old/new regression, mutation checks and quality gates
        run: python3 .audit-review/c03/verify.py
      - name: S07 publish only the validated product tree
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: python3 .audit-review/c03/verify.py publish
