name: Audit round 2 validation
on:
  push:
    branches: [audit/round2-validation-20260917]
permissions:
  contents: read
concurrency:
  group: audit-round2-validation
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Integrate pinned remediation and apply reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          cp -r audit-inputs "$RUNNER_TEMP/round2-inputs"
          git config user.name 'IM Bridge audit validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach 01d4fb24503adc74508c8a6e3b35facf05cc204b
          for sha in \
            6859535ad30e7bb0e91f1a3ca25a8ab40a762434 \
            31d47578d074a19fbe8fa8be3fd49320435804b7 \
            0fe3ce763735e97f4cfef30deb690e95c26f8611 \
            fccb94ce798a3a01ff23809490233089938023ae \
            3c87e51393c35840edc86e076af637b7eff20541 \
            3bdbebe6aef57b146df0a74d10a2f9c1aed9f9fe \
            912b2cb8d8f24a7dda6f3b11b938f760e5eaf909; do
            git fetch --no-tags origin "$sha"
            git merge --no-ff --no-edit "$sha"
          done
          python3 "$RUNNER_TEMP/round2-inputs/apply.py" "$RUNNER_TEMP/round2-inputs"
          cargo update -p sqlx --precise 0.9.0
          cargo fmt --all
          git diff --check
          python3 scripts/publication_gate.py
          python3 - <<'PY'
          import pathlib, tomllib
          names={p['name'] for p in tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package']}
          assert not names.intersection({'rsa','proc-macro-error2','teloxide'}), names.intersection({'rsa','proc-macro-error2','teloxide'})
          PY
          git add -A
          git commit -m 'fix: integrate audited remediation, recover inbox online and close validation gaps'
          mkdir -p "$RUNNER_TEMP/audit-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-evidence/candidate-sha.txt"
          git diff --stat 01d4fb24503adc74508c8a6e3b35facf05cc204b HEAD > "$RUNNER_TEMP/audit-evidence/diff-stat.txt"
          git diff 01d4fb24503adc74508c8a6e3b35facf05cc204b HEAD > "$RUNNER_TEMP/audit-evidence/candidate.patch"
          git bundle create "$RUNNER_TEMP/audit-evidence/candidate.git.bundle" HEAD
      - name: Targeted inbox and real transport tests
        run: |
          cargo test --locked --lib modules::telegram::inbox_
          cargo test --locked --test transport_runtime_contract
      - name: Verify online-retry test detects a compilable regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess
          p=pathlib.Path('src/modules/telegram/mod.rs')
          original=p.read_text()
          marker='if tokio::time::Instant::now() >= next_inbox_recovery_at {'
          assert original.count(marker)==1
          try:
              p.write_text(original.replace(marker,'if false && tokio::time::Instant::now() >= next_inbox_recovery_at {'))
              run=subprocess.run(['cargo','test','--locked','--lib','failed_inbox_recovers_in_the_same_poller_with_no_new_updates'],capture_output=True,text=True)
              log=run.stdout+run.stderr
              pathlib.Path(os.environ['RUNNER_TEMP'],'audit-evidence','online-retry-mutation.txt').write_text(log)
              assert run.returncode!=0 and 'could not compile' not in log
              assert 'test result: FAILED. 0 passed; 1 failed;' in log, log[-5000:]
              print('PASS: removing live recovery compiled, then the intended regression test failed')
          finally:
              p.write_text(original)
          PY
      - name: Full formatting, Clippy, default and all-feature local tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          python3 scripts/test_feature_contracts.py
          cargo build --release --locked
          python3 scripts/publication_gate.py
          test -z "$(git status --porcelain)"
      - name: Full lockfile advisory gate without exceptions
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - name: Export exact candidate and evidence (also retain failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: round2-candidate-source
          path: ${{ runner.temp }}/audit-evidence
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: integrate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish only the tested candidate to a new review branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name round2-candidate-source --dir "$RUNNER_TEMP/candidate"
          git clone "$RUNNER_TEMP/candidate/candidate.git.bundle" "$RUNNER_TEMP/product"
          cd "$RUNNER_TEMP/product"
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/candidate/candidate-sha.txt")"
          git merge-base --is-ancestor 01d4fb24503adc74508c8a6e3b35facf05cc204b HEAD
          test ! -d audit-inputs
          test ! -f .github/workflows/audit-round2-validation.yml
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 01d4fb24503adc74508c8a6e3b35facf05cc204b
          test -z "$(git ls-remote origin refs/heads/audit/round2-merge-ready-20260917)"
          git push origin HEAD:refs/heads/audit/round2-merge-ready-20260917
          echo 'Validated review branch published; main was not modified.'
