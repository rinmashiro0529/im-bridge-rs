name: Audit identity fixture credentials

on:
  push:
    branches: [audit-work/identity-credentials-20260917]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'rinmashiro0529/im-bridge-rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ runner.temp }}/identity-credentials-target
      CANDIDATE: ${{ runner.temp }}/identity-credentials-candidate
      EXPECTED_HEAD: d829c7278fc0561114c3afd16e0a8cbd1129e73e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare an exact, isolated test-only correction
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$CANDIDATE" "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['CANDIDATE']) / 'tests/identity_lifecycle.rs'
          raw = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob == 'f32afe909af418afa2e34dd4d53b4659e9a95469', 'Unexpected input test file'
          source = raw.decode('utf-8')
          before_tests = re.findall(r'#\[tokio::test\]\s+async fn (\w+)', source)
          before_assertions = len(re.findall(r'\bassert(?:_eq|_ne)?!', source))

          def once(old, new):
              global source
              assert source.count(old) == 1, 'Replacement anchor is not unique'
              source = source.replace(old, new, 1)

          once('use tower::ServiceExt;\n', 'use tower::ServiceExt;\nuse zeroize::Zeroizing;\n')
          once('const PASSWORD: &str = "synthetic-password-only";',
               'fn test_password() -> Zeroizing<String> {\n    Zeroizing::new(uuid::Uuid::new_v4().to_string())\n}')
          once('    admin: Actor,\n}', '    admin: Actor,\n    password: Zeroizing<String>,\n}')
          source = re.sub(r'\bPASSWORD\b', '&fixture.password', source)
          once('    let state = Arc::new(AppState::bootstrap(config, true).await.unwrap());\n',
               '    let state = Arc::new(AppState::bootstrap(config, true).await.unwrap());\n    let password = test_password();\n')
          head, tail = source.split('async fn row_counts', 1)
          assert head.count('&fixture.password') == 1
          source = head.replace('&fixture.password', '&password') + 'async fn row_counts' + tail
          once('        state,\n        admin,\n', '        state,\n        admin,\n        password,\n')
          once('    let before = row_counts(state).await;\n    let repeated = state',
               '    let before = row_counts(state).await;\n    let other_password = Zeroizing::new(format!("{}-different", fixture.password.as_str()));\n    let repeated = state')
          assert source.count('"different-password-only"') == 2
          source = source.replace('"different-password-only"', '&other_password')
          once('async fn login_cookie(app: &axum::Router, username: &str) -> String {',
               'async fn login_cookie(app: &axum::Router, username: &str, password: &str) -> String {')
          once('json!({"username": username, "password": &fixture.password})',
               'json!({"username": username, "password": password})')
          once('let cookie = login_cookie(&app, &actor.account.username).await;',
               'let cookie = login_cookie(&app, &actor.account.username, &fixture.password).await;')
          assert re.findall(r'#\[tokio::test\]\s+async fn (\w+)', source) == before_tests
          assert len(re.findall(r'\bassert(?:_eq|_ne)?!', source)) == before_assertions
          assert len(before_tests) == 8
          assert 'PASSWORD' not in source and 'synthetic-password-only' not in source
          assert 'different-password-only' not in source
          path.write_text(source, encoding='utf-8')
          print(f'Preserved all {len(before_tests)} test names and {before_assertions} assertion sites.')
          PY
      - name: Format and verify the change allowlist
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          cargo fmt --all
          cargo fmt --all --check
          test "$(git diff --name-only)" = tests/identity_lifecycle.rs
          git diff --check
          python3 scripts/publication_gate.py
          git diff --stat
      - name: Identity regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          cargo test --locked --test identity_lifecycle
      - name: All-target and all-feature lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Complete default test suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          cargo test --all --locked
      - name: Release build
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          cargo build --release --locked
      - name: Publish only the tested file to the existing PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git diff --name-only)" = tests/identity_lifecycle.rs
          git diff --check
          git add -- tests/identity_lifecycle.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(identity): use ephemeral fixture passwords without weakening assertions'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$auth"
          remote_head=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote https://github.com/rinmashiro0529/im-bridge-rs.git refs/heads/audit/identity-lifecycle | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push https://github.com/rinmashiro0529/im-bridge-rs.git HEAD:refs/heads/audit/identity-lifecycle
          {
            echo '## Validated identity fixture correction'
            echo "Commit: $(git rev-parse HEAD)"
            echo 'All eight test names and assertion sites were preserved.'
            echo 'This does not claim that CodeQL or RustSec has cleared.'
            git show --stat --oneline HEAD
          } >> "$GITHUB_STEP_SUMMARY"
